[project]
name = "coaching-ai-backend"
version = "1.0.0"
description = "Koçluk platformu için antrenman/beslenme planı üretimi ve öneri motoru FastAPI servisi."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "orjson>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
# 100 yerine 120: Türkçe kullanıcı mesajları (ör. öneri metinleri) çoğunlukla
# 100-120 karakter aralığında ve cümle ortasından bölmek okunabilirliği bozuyor.
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "S", "PT"]
# RUF001/002/003: bu proje Türkçe docstring/comment/string içeriyor; "ambiguous unicode"
# uyarıları Türkçe karakterler (ı, ş, ğ, ...) için sürekli yanlış pozitif üretiyor.
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# S311: testlerde rastgele test verisi üretimi için kullanılıyor, kriptografik değil.
"tests/*" = ["S101", "ANN201", "ANN001", "S106", "S311"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=70"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
