version: 2

# KAPSAM DONDURMA KARARI (2026-08-20, Fable danışmasıyla — bkz.
# docs/discovery/dependabot-triyaji-2026-08-19.md): Bu proje bir portfolyo
# projesidir ve kapsamı donduruluyor. Donmuş bir repoda haftalık npm
# sürüm-güncelleme (version-update) PR akışı anlamsız hâle geldi: pnpm
# workspace + tek paylaşılan kök `pnpm-lock.yaml` kombinasyonu bilinen bir
# dependabot-core kusuruyla (dependabot-core#10758) çakışıyor ve her PR
# `ERR_PNPM_OUTDATED_LOCKFILE` ile kırmızı açılıyor — hiçbiri gerçek bir CI
# sinyali taşımıyor. Biriken bayat/kırmızı PR'lar hiç PR olmamasından daha
# kötü görünüyor, bu yüzden npm ecosystem girdisi TÜMDEN kaldırıldı (aşağıda
# yoktur). Bu SADECE version-update akışını (bu dosyadaki `updates:` blokları)
# kapatır — GitHub'ın Dependabot alerts / security updates mekanizması
# (repo Settings → Code security → Dependabot) TAMAMEN AYRI bir sistemdir ve
# bu dosyadan etkilenmez; npm bağımlılıklarındaki güvenlik açıkları için
# uyarılar ve otomatik güvenlik PR'ları olduğu gibi açık kalır.
#
# Diğer üç ekosistem (pip, github-actions, docker × 2) bilinçli olarak açık
# bırakıldı: hiçbiri npm'in yaşadığı kilit dosyası sorununu taşımıyor, hiçbiri
# şu ana kadar bayat PR birikimi yaratmadı (bu turdaki 10 açık PR'ın tamamı
# npm'den geldi — bkz. triyaj raporu), ve her biri kendi haftalık 5-PR
# tavanıyla zaten ucuz. `github-actions` için ayrıca ürün-dışı bir gerekçe
# var: kapsam donmuş olsa bile CI koşmaya devam edecek (portfolyo
# değerlendiricileri fork/klonlayıp workflow'ları tetikleyebilir); action'lar
# GitHub tarafından deprecate edilip kaldırılabiliyor, bu app-seviyesi bir
# özellik borcu değil, CI'ın çalışır kalması için operasyonel bir bakım —
# bu yüzden version-update burada tutuluyor.
#
# Yeniden aktive etmek istenirse: npm ecosystem girdisini
# docs/discovery/dependabot-triyaji-2026-08-19.md §3'teki hazır yapılandırmayla
# (`directory: '/'`, mevcut groups/ignore kuralları) geri ekle.

updates:
  - package-ecosystem: pip
    directory: '/ai_backend'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # Kök Dockerfile Node 24 LTS'e bilinçli pinlendi (Faz 4.5 commit 7a2).
      # Sonraki LTS'e (ör. 26-alpine) geçiş yalnız elle, ayrı bir fazda yapılır;
      # dependabot'un major bump önerisi (bkz. eski PR #2) burada istenmiyor.
      - dependency-name: 'node'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: docker
    directory: '/ai_backend'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
