version: 2

updates:
  # Faz 4.5'te pnpm workspace monorepo'ya geçildi (apps/web, apps/mobile,
  # packages/{config,types,api-client,logger}); npm ekosistemi artık tek bir
  # kök package.json değil, bu dört ağaçta bağımlılık taşıyor (B-055).
  #
  # DÜZELTME (B-055, 2026-08-20 triyaj — bkz. docs/discovery/dependabot-triyaji-2026-08-19.md):
  # `directories: ['/', '/apps/web', '/apps/mobile', '/packages/*']` (çoğul, çoklu yol)
  # denendi ama bu, dependabot-core'un bilinen bir pnpm-workspace kusurunu tetikledi
  # (dependabot-core#10758 — "pnpm workspace'lerinde ağaç taraması yok"; kısmi düzeltme
  # PR #10806 2024-12-03'te merge edildi ama YETERSİZ). Sonuç ölçüldü: 10/10 PR
  # `pnpm install --frozen-lockfile` adımında ERR_PNPM_OUTDATED_LOCKFILE ile düştü —
  # dependabot manifest dosyasını güncelliyor ama kökteki PAYLAŞILAN pnpm-lock.yaml'ı
  # workspace bütünüyle tutarlı yeniden çözemiyor. Topluluk tarafından doğrulanmış
  # çözüm TEK KÖK `directory: '/'`'e dönmek (alveusgg PR #868, "Dependabot only needs
  # to run against root for pnpm workspaces" — kendi ölçümümüzle birebir eşleşti).
  # YANLIŞ İZLENİM VERMESİN: monorepo'yu görmesi için glob GEREKMİYOR — pnpm workspace
  # kökten çözüldüğü için dependabot tek `directory: '/'` ile apps/*, packages/*
  # dahil TÜM ağacı zaten görür; glob burada FAZLA ve ZARARLIYDI (kilit dosyasını
  # bozan taraf oydu), gerekli değildi.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    # 5 -> 10: eskiden 4 ayrı dizin girdisi vardı, her biri kendi 5-PR bütçesine
    # sahipti (teorik tavan ~20 npm PR'ı). Tek kök girdisine düşünce tüm workspace
    # npm güncellemeleri AYNI bütçeyi paylaşıyor; mevcut 10 açık PR göz önüne
    # alındığında 5 darboğaz yaratır (kesin değil, izlenmeli).
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    groups:
      next:
        patterns:
          - 'next'
          - 'next-*'
          - 'eslint-config-next'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-*'
          - '@types/react'
          - '@types/react-dom'
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # apps/mobile: Expo SDK 57'ye kilitli (ADR-0023 madde 10, Faz 4.5 commit 6).
      # expo/react-native paketlerinin major/minor bump'ı SADECE `expo install`
      # ile elle yapılır — dependabot'un bağımsız önerdiği sürümler SDK uyumunu
      # bozabilir. Patch güncellemeleri serbest.
      - dependency-name: 'expo'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: 'expo-*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: 'react-native'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: 'react-native-*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      # Tek React kuralı: react/react-dom tüm workspace'te (web, mobile,
      # @repo/api-client peerDependency) 19.2.4'e pinli; major/minor bump'lar
      # elle ve tüm ağaçlarda birlikte yapılır.
      - dependency-name: 'react'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: 'react-dom'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      # B-051: TypeScript 6.0.3'e bilinçli pin (Faz 4.5 c7a1 — web + mobil aynı fiziksel
      # .pnpm örneğine symlink'li, tek örnek). TS 7.0 kararlı derleyici API'siz çıktı
      # (typescript-eslint tip-farkında kurallar buna bağımlı) ve strict/module
      # varsayılanlarını değiştiriyor; B-051 elle yeniden değerlendirilene kadar bastır
      # (bkz. docs/discovery/dependabot-triyaji-2026-08-19.md §4.1, eski PR #16/#19).
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # tailwindcss 3.x→4.x gerçek bir CSS migration'ı (PostCSS mimarisi, globals.css,
      # sınıf dili); görsel kimlik katmanı Faz 2 Katman B'ye kasıtlı bağlı, ratchet
      # sayaçları buna bağlı. O faz başlayana kadar bastır (bkz. triyaj §4.3, eski PR #17).
      - dependency-name: 'tailwindcss'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: pip
    directory: '/ai_backend'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # Kök Dockerfile Node 24 LTS'e bilinçli pinlendi (Faz 4.5 commit 7a2).
      # Sonraki LTS'e (ör. 26-alpine) geçiş yalnız elle, ayrı bir fazda yapılır;
      # dependabot'un major bump önerisi (bkz. eski PR #2) burada istenmiyor.
      - dependency-name: 'node'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: docker
    directory: '/ai_backend'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
