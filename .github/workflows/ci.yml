name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Faz 1.5 Grup 6 / T-05: gitleaks'in PR/push adımları yalnızca YENİ commit'leri tarar
    # (bkz. `security` job'u). Bu haftalık job, o taramaların atladığı her şeyi (ör.
    # `--no-verify` ile geçmişte main'e girmiş bir commit) yakalamak için TAM git geçmişini
    # tarar. Pazartesi 03:00 UTC — mesai dışı, diğer CI yüküyle çakışma ihtimali düşük.
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Build-time için sahte NEXT_PUBLIC_* değerleri (gerçek sır değil).
  # NEXT_PUBLIC_SUPABASE_URL BİLEREK hosted-DIŞI bir değer: `*.supabase.co` deseni
  # `apps/web/src/env.server.ts`'teki fail-closed Katman 2 guard'ını tetikler ve
  # `vi.unstubAllEnvs()` çağıran 7 test dosyası (env-hosted-guard, env, env-production,
  # auth-sign-in-rate-limit, security-events, proxy-rate-limit, csp-nonce) test sonunda
  # ambient `process.env`'e döner — CI'ın ambient'ı bu değişkenle DOLU olduğundan guard
  # 26 kez "BARINDIRILAN (uzak) proje" diye fırlatıp bu testleri kırıyordu (yerelde ambient
  # boş olduğu için aynı guard `if (!url) return` ile sessizce geçiyordu, kırık yalnızca
  # CI'da görünüyordu). Guard KENDİSİ CI'da da canlı kalmaya devam ediyor — gerçek bir
  # hosted hedef (`*.supabase.co`/`.com`) verilirse hâlâ fırlatır; bu bilinçli bir
  # düzeltme, guard'a tanınmış bir muafiyet DEĞİL.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  frontend:
    name: Frontend (lint / type-check / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm, setup-node'dan ÖNCE kurulmalı: `cache: 'pnpm'` setup-node'un pnpm store
      # yolunu `pnpm store path` ile sorgulaması demektir, pnpm o anda PATH'te yoksa adım
      # düşer. `version` BİLEREK verilmiyor — action, package.json'daki `packageManager`
      # alanını okuyup sürümü oradan sabitler (tek doğruluk kaynağı).
      #
      # B-054 / Faz 4.5 commit 7b: v4 → v6 (son sürüm v6.0.10, ölçüldü). Aradaki iki majör
      # DAVRANIŞ DEĞİŞTİRMİYOR: v5 yalnızca action runtime'ını Node.js 24'e çekti (bu repo
      # zaten Node 24'te, c7a2), v6 yalnızca pnpm v11 desteği ekledi. `packageManager`
      # alanıyla action ayarı çeliştiğinde hata fırlatan v4 davranışı korunuyor — biz
      # `version` vermediğimiz için o yol hiç tetiklenmiyor.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Faz 4.5 commit 7b: aşağıdaki kapı komutlarının HİÇBİRİNİN metni değişmedi ama
      # artık kökte `turbo run <görev> --filter=!mobile` çalıştırıyorlar (bkz. kök
      # package.json + turbo.json). Bunun iki gözle görülür sonucu var:
      #   1. `lint` artık `apps/web`'e ek olarak `packages/*`'ı da kapsıyor (B-049) —
      #      uyarı tabanı bu yüzden 13'ten 17'ye ÇIKTI (13 web + 4 @repo/logger console
      #      adaptörü). Bu bir GERİLEME DEĞİL, daha önce hiç lint'lenmeyen kod kütlesinin
      #      kapsama girmesidir.
      #   2. `apps/mobile` bu job'un kapsamı DIŞINDA (`--filter=!mobile`): mobil kapıları
      #      aşağıdaki ayrı `mobile` job'unda PARALEL koşuyor, böylece `frontend`ın süresi
      #      (ve ona `needs:` ile bağlı `e2e`/`docker` kritik yolu) uzamıyor.
      - name: Lint
        run: pnpm run lint

      - name: Kimlik ratchet (ADR-0018)
        # Tek yönlü mandal: eski görsel dilin (font-black, gradyan, rounded-3xl,
        # ham #8b5cf6, emoji) sayaçları kilitli tavanın üstüne çıkarsa burada
        # kırmızı olur. bkz. docs/adr/0018-kimlik-gecisi-iki-katman-ve-ci-ratchet.md
        # ve scripts/identity-ratchet.mjs. Ucuz bir grep taraması olduğu için ayrı
        # bir job değil, mevcut frontend job'una bir adım olarak eklendi.
        run: pnpm run ratchet

      - name: Type-check
        run: pnpm run type-check

      - name: Type-check (E2E testleri)
        # B-048: kök `type-check` (tsc, apps/web/tsconfig.json) `tests/e2e`'yi kendi
        # `exclude` listesinde bilerek dışlıyor (bkz. o dosyadaki not) — yani E2E test
        # dosyalarındaki tip hataları hiçbir CI kapısında yakalanmıyordu.
        # `apps/web/tsconfig.e2e.json` ayrı bir katı taban (@repo/config/tsconfig/e2e.json)
        # kullanıp SADECE `tests/e2e/**/*.ts` + `playwright.config.ts`'i kapsıyor.
        # Bu adım yerel bir Supabase yığını GEREKTİRMEZ (salt tip denetimi), bu yüzden
        # yığının olmadığı `frontend` job'unda güvenle çalışır — `e2e` job'una taşımaya
        # gerek yok.
        run: pnpm run type-check:e2e

      - name: Unit tests (coverage)
        run: pnpm run test:coverage

      - name: Upload coverage report
        # B-054 / Faz 4.5 commit 7b: v4 → v7 (son majör). Kullandığımız üç input
        # (`name`, `path`, `retention-days`) üç majörde de aynı anlamda: v5/v6 yalnızca
        # action runtime'ını Node 24'e taşıdı (runner ≥ 2.327.1 gerekir — GitHub-hosted
        # runner'lar bunu karşılıyor), v7 paketi ESM'e geçirdi ve OPSİYONEL `archive`
        # input'unu ekledi. `archive: false` verilirse `name` yok sayılıyor — biz o input'u
        # vermiyoruz, dolayısıyla bu repoda davranış değişikliği YOK. Aynı bump aşağıdaki
        # iki `upload-artifact` adımı için de geçerli.
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          # Faz 4.5: vitest artık `apps/web` içinde koşuyor, coverage çıktısı da orada.
          path: apps/web/coverage/
          retention-days: 14

      - name: Build
        run: pnpm run build

  mobile:
    name: Mobile (type-check / lint / expo-doctor / expo export)
    runs-on: ubuntu-latest
    # BİLEREK AYRI VE PARALEL bir job (Faz 4.5 commit 7b): mobil kapıları `frontend`e adım
    # olarak eklenseydi, `frontend` hem kendi süresine mobil tsc+lint+export'u eklerdi hem de
    # ona `needs:` ile bağlı `e2e` (timeout 20 dk, gerçek koşum ~10 dk) ve `docker` job'larını
    # geciktirirdi. Kritik yolu E2E belirlediği için paralel bir mobil job duvar süresini
    # UZATMAZ. Ayrıca mobil kırılması web kapılarından bağımsız, tek bakışta okunur olur.
    #
    # `needs:` YOK — hiçbir şeyi beklemez, checkout'la birlikte başlar.
    #
    # timeout: ilk koşumun süresi ölçülmedi (yerelde kurulum hariç `expo export` ~1,5 dk,
    # `expo-doctor` ~20 sn). CI'da soğuk `pnpm install` + üç platform bundle'ı için makul bir
    # üst sınır olarak 20 dk verildi; asılı kalan bir Metro koşusu job'u sonsuza kadar
    # tutmasın diye sınır AÇIKÇA yazılıyor.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm, setup-node'dan ÖNCE (bkz. `frontend` job'undaki ayrıntılı not).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        # FİLTRESİZ kurulum ZORUNLU: bu job'un ihtiyacı olan React Native/Expo ağacı
        # `apps/mobile`'da. (Karşılaştırma: `Dockerfile` `--filter web...` ile kurar ve o
        # ağacı bilerek DIŞARIDA bırakır — bkz. Dockerfile `deps` aşaması.)
        run: pnpm install --frozen-lockfile

      - name: Type-check (apps/mobile)
        # = `turbo run type-check --filter=mobile` → apps/mobile'da `tsc --noEmit`.
        run: pnpm run mobile:type-check

      - name: Lint (apps/mobile)
        # = `turbo run lint --filter=mobile`. apps/mobile'ın ESLint yapılandırması kendi
        # TypeScript parser'ını AÇIKÇA kuruyor (Next'e özgü zincir mobilde yok) —
        # bkz. apps/mobile/eslint.config.mjs.
        run: pnpm run mobile:lint

      - name: expo-doctor
        working-directory: apps/mobile
        # ÖLÇÜLMÜŞ TUZAK: `pnpm --filter mobile exec expo-doctor` ÇALIŞMAZ — `expo-doctor`
        # workspace'in hiçbir paketinin bağımlılığı değil, dolayısıyla `node_modules/.bin`
        # altında binary YOK ve komut "command not found" ile düşer. Doğru çağrı, paketi
        # anlık indirip çalıştıran `npx expo-doctor`'dır (yerelde bu tam komutla 21/21 geçti).
        #
        # Bu adım AĞA ÇIKAR: expo-doctor, kurulu paket sürümlerini Expo SDK 57'nin beklenen
        # sürüm matrisiyle karşılaştırmak için Expo'nun uzak API'sini sorgular. Bu yüzden
        # `--verbose` ile tam çıktı log'lanıyor: adım kırmızıya dönerse ilk şüphelinin
        # gerçek bir sürüm uyumsuzluğu mu yoksa ağ/registry erişimi mi olduğu log'dan
        # DOĞRUDAN okunabilsin, tahmin edilmesin.
        run: npx expo-doctor --verbose

      - name: expo export (smoke)
        # Cihazsız en güçlü kanıt: Metro'nun üç platform için de bundle üretebildiğini ve
        # workspace TS paketlerini (@repo/types, @repo/logger) symlink ardından çözüp
        # transpile edebildiğini gösterir. AC-4.5.3'ü KAPATMAZ — çalışma zamanı (boot,
        # çift-React, native modül) hâlâ kullanıcının Expo Go smoke'unu bekliyor.
        run: pnpm run mobile:export

  backend:
    name: Backend (ruff / mypy / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # B-054 / Faz 4.5 commit 7b: v5 → **v7**. Bu bir "en son majöre çık" bumpı DEĞİL,
        # ölçülmüş bir tavan seçimi:
        #
        # * En son sürüm bugün **v10.0.1** (2026-08-14). Ama v8.0.0 sürüm notunda action
        #   MAJÖR/MİNÖR ETİKET YAYINLAMAYI BIRAKTI (tedarik zinciri sertleştirmesi, tj-actions
        #   olayı gerekçesiyle). ÖLÇÜLDÜ (`git ls-remote --tags`): repoda yalnızca
        #   v1…v7 kayan majör etiketleri var; `@v8`/`@v9`/`@v10` DİYE BİR ETİKET YOK.
        #   v8+ kullanmak `@v10.0.1` gibi TAM SÜRÜM veya commit hash'i pinlemeyi gerektirir —
        #   bu, reponun bugünkü "kayan majöre pinle" sözleşmesini değiştiren ayrı bir karardır
        #   (dur-ve-sor; kullanıcıya raporlandı, bu commit'te BİLEREK alınmadı).
        # * v9.0.0 `prune-cache` varsayılanını `false` yapıyor (Actions cache kullanımı artar),
        #   v10.0.0 `pull_request_target`/`workflow_run`/`release` olaylarında önbelleği
        #   kapatıyor — bu repo yalnızca push/pull_request/schedule kullandığı için ikincisi
        #   etkisiz, ama ikisi de davranış değişikliğidir.
        #
        # v7'ye kadar olan kırıcı değişikliklerin bu repoya etkisi ÖLÇÜLDÜ:
        # * v6: `python-version` artık venv'i OTOMATİK ETKİNLEŞTİRMİYOR (yeni
        #   `activate-environment` input'u, varsayılan false). Bu job'un setup-uv'den SONRAKİ
        #   tüm adımları `uv sync` / `uv run` — ikisi de projenin kendi ortamını (`.venv`)
        #   kendisi çözer, ambient bir venv aktivasyonuna İHTİYAÇ DUYMAZ. (`security` job'u
        #   da yalnızca `uvx` kullanıyor, aynı şekilde bağımsız.) v6 ayrıca `pyproject-file`/
        #   `uv-file` input'larını kaldırdı — bu repo ikisini de kullanmıyor.
        # * v6: varsayılan `cache-dependency-glob` genişledi → yalnızca BİR KEZ cache miss.
        # * v7: action runtime'ı node20 → node24. GitHub-hosted runner'larda sorunsuz
        #   (bu repo zaten `actions/checkout@v7`/`setup-node@v7` kullanıyor); `server-url`
        #   input'u kaldırıldı — kullanılmıyor.
        uses: astral-sh/setup-uv@v7
        with:
          # 3.12 -> 3.14 (B-055): `ai_backend` bu turda 3.14'e çekildi (Dockerfile iki
          # stage de `python:3.14-slim`, `.python-version` 3.14) ve kapılar (ruff/mypy/
          # pytest, 82 test, %94.94 coverage) 3.14 altında ölçüldü. Bu job `ai_backend`'in
          # kendi ortamını (`uv sync` + `pytest`/`ruff`/`mypy`) kurduğu için pin buradan
          # SÜRÜKLENİRSE (3.12'de kalırsa) testler Docker imajının çalıştıracağı sürümden
          # farklı bir Python'da geçmiş olur — sessiz bir sürüm sürüklenmesi. `security`
          # job'undaki aynı pinin 3.12'de KALMASININ nedeni farklı: bkz. o job'daki not.
          python-version: '3.14'

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app

      - name: pytest
        run: uv run pytest

  e2e:
    name: E2E (Playwright)
    needs: [frontend]
    runs-on: ubuntu-latest
    # PR-only bir E2E kapısı bu repoda doğrudan-main-push akışında TANIM GEREĞİ ölü koddu:
    # bu repo 22/22 push ile ilerliyor, hiçbir PR koşumu yok — yani e2e hiç çalışmamıştı
    # (ölçüldü). `!= 'schedule'` push VE pull_request'te koşturur, yalnızca haftalık
    # gitleaks-tam-geçmiş cron'unu (bkz. üstteki `on.schedule`) dışlar — o job zaten yalnız
    # güvenlik taraması için var, E2E'ye ihtiyacı yok. Üst üste push'larda E2E'nin
    # birikmesi `concurrency: cancel-in-progress: true` (yukarıda) ile zaten kesiliyor.
    if: github.event_name != 'schedule'
    # 20 -> 30 (B-055): run 32218286151'de job `cancelled` oldu — asıl E2E testleri
    # KIRIK DEĞİLDİ, `Install Playwright browsers` adımı apt aynası (azure.archive.ubuntu.com
    # -> archive.ubuntu.com) takıldığı için 20 dakikalık bütçe `Build` ve `Run E2E tests`
    # adımlarına hiç sıra gelmeden tükendi. Bu job zaten Supabase yığını + tarayıcı kurulumu +
    # iki build (bkz. aşağıdaki NOT) + testleri TEK bütçede sığdırıyor; 20 dk ölçülen en kötü
    # hâli karşılamıyor. Aşağıdaki tarayıcı önbelleği bu riski azaltır ama apt bağımlılık
    # kurulumu (`install-deps`) önbellek isabetinde bile HER koşumda taze VM'de tekrar çalışır,
    # o yüzden bütçe de ayrıca büyütüldü.
    timeout-minutes: 30
    # NOT: playwright.config.ts'deki webServer bloğu `pnpm run build && pnpm run
    # start` çalıştırıyor ve CI'da (process.env.CI true olduğu için)
    # reuseExistingServer: false oluyor — yani `pnpm run test:e2e` adımı
    # webServer'ı kendi alt process'i olarak başlatıp gizlice TEKRAR build
    # alıyor. Bu ikinci (örtük) build de gerçek Supabase URL/anon key'e
    # ihtiyaç duyar, yoksa testler hiçbir yere bağlanamaz.
    # İdeal olan bu değerleri statik bir job-level `env:` ile tüm step'lere
    # sızdırmaktı ("en temizi") — ama biz anon key'i sabit gömmek yerine
    # `supabase status` ile ÇALIŞMA ZAMANINDA (runtime) okumayı tercih
    # ettiğimiz için (bkz. "Capture local Supabase connection info" adımı),
    # değer job başlamadan (statik YAML ayrıştırma anında) bilinemiyor —
    # job-level `env:` bu yüzden burada kullanılamıyor. Bunun yerine aynı
    # "tüm ilgili step'lere sızma" etkisini elde etmek için: (1) değerleri
    # `$GITHUB_ENV`'e yazıyoruz, (2) hem "Build" adımına hem de webServer'ı
    # tetikleyen "Run E2E tests" adımına AÇIKÇA step-level `env:` ile
    # geçiriyoruz — böylece webServer'ın alt process'i de dahil olmak üzere
    # üstteki placeholder workflow-env'i güvenilir şekilde override ediyoruz
    # (step-level env, job/workflow-level env'e karşı her zaman kazanır).
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      # pnpm, setup-node'dan ÖNCE (bkz. `frontend` job'undaki aynı notu).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        # B-054 / Faz 4.5 commit 7b: v1 → v3 (son majör; ölçüldü).
        # ÖLÇÜM (`git ls-remote`): eski `@v1` bir ETİKET DEĞİL, `refs/heads/v1` DALIYDI —
        # yani bugüne kadar hareketli bir dala pinliydik. `v3` gerçek bir etiket; bu bump
        # aynı zamanda bir sağlamlaştırma.
        # DAVRANIŞ DEĞİŞİKLİĞİ (bilinçli, kullanıcıya raporlandı): v3 CLI'yi artık GitHub
        # release'lerinden değil **npm paketinden** kuruyor ve `github-token` input'unu
        # kaldırdı (bu repo o input'u hiç kullanmıyordu). Gözlemlenebilir sözleşme aynı:
        # `version: latest` v3'te de destekleniyor (`latest`/`beta`/sabit npm sürümü).
        # v2'den beri `version` HİÇ verilmezse CLI sürümü kök kilit dosyasından
        # (`pnpm-lock.yaml` → kökün `supabase` devDependency'si) türetiliyor; bu, yerel ile
        # CI'ı tek sürüme kilitlerdi ama BUGÜNKÜ NİYETİ (her zaman en son CLI) değiştirirdi —
        # o yüzden `latest` BİLEREK korundu.
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Reset database (run migrations + seed)
        # NOT: `--no-seed` KULLANMIYORUZ — E2E testleri coach@example.com /
        # client1@example.com gibi seed kullanıcılarıyla giriş yapıyor.
        # `supabase db reset` burada YIKICI DEĞİL: bu adımdan hemen önce
        # `supabase start` ile CI runner'ında SIFIRDAN, boş ve geçici bir
        # yığın ayağa kaldırıldı; reset edilecek gerçek/kalıcı bir veri yok.
        run: supabase db reset

      - name: Verify Supabase DB container is up
        # `pnpm run test:rls` (package.json) hedef container adını
        # `supabase_db_my-coaching-app` olarak SABİT kullanıyor; bu ad
        # `supabase/config.toml`'daki `project_id = "my-coaching-app"`
        # değerinden türüyor. `supabase start` bu adı örtük olarak üretir,
        # dolayısıyla normalde CI'da da aynı olmalı — ama bu bağ kırılgan
        # (CLI davranışı değişebilir, config.toml elle değiştirilebilir).
        # Container yoksa bir sonraki adımdaki `docker exec` hatası
        # ("No such container") kafa karıştırıcı olur; burada erkenden,
        # net bir mesajla düşüyoruz.
        run: |
          if ! docker ps --format '{{.Names}}' | grep -q '^supabase_db_my-coaching-app$'; then
            echo "::error::supabase_db_my-coaching-app container'i bulunamadi. 'supabase start' beklenen adla bir DB container'i olusturmamis olabilir (bkz. supabase/config.toml project_id). 'docker ps' ciktisi:"
            docker ps --format '{{.Names}}'
            exit 1
          fi

      - name: Run RLS policy tests
        # supabase/tests/rls.test.sql: her senaryo BEGIN/ROLLBACK icinde
        # calisir (veri degistirmez) ve basarisizlikta \set ON_ERROR_STOP
        # sayesinde psql sifirdan farkli exit code doner. Bilerek "db
        # reset" SONRASI (seed verisi hazir olmali) ve "build" ONCESI
        # calistiriliyor: RLS kirilmissa job build/E2E'ye hic girmeden,
        # erken ve net bir mesajla dussun.
        run: pnpm run test:rls

      - name: DB tipleri drift kontrolü (B-047)
        # ADR-0023 §3 / AC-4.5.4 (Faz 4.5 commit 7b): `db:types` script'inin GÖVDESİ artık
        # `packages/types/package.json`'da — üretilen dosyaya sahip olan paketle aynı yerde.
        # Kökte YALNIZCA bir delegasyon kaldı (`pnpm --filter @repo/types run db:types`), bu
        # yüzden aşağıdaki komut ve `git diff` yolu DEĞİŞMEDİ; bu adım taşımadan etkilenmez.
        # (Taşıma bilerek delegasyonla yapıldı: aksi hâlde bu adım aynı commit'te
        # güncellenmek zorunda kalırdı ve unutulursa drift kontrolü sessizce kırılırdı.)
        # ÖLÇÜLDÜ: `supabase` CLI kökün devDependency'si olarak KALDI ve taşımadan sonra da
        # `packages/types` içinden çözülüyor — pnpm, workspace paketlerinin script'lerini
        # çalıştırırken workspace KÖKÜNÜN `node_modules/.bin` dizinini de PATH'e ekliyor
        # (`pnpm --filter @repo/types exec supabase --version` → 2.114.0). Yani CLI'yi
        # pakete taşımak GEREKMEDİ.
        #
        # `pnpm run db:types` = `supabase gen types typescript --local ...` — YEREL,
        # AYAKTA bir Supabase yığını gerektirir. Bu yığını ayağa kaldıran CI'daki TEK
        # job burasıdır ("Start local Supabase stack" + "Reset database" adımları
        # yukarıda); `frontend` job'unda yığın YOK, bu adım oraya konsaydı kesin patlardı.
        # "Reset database" SONRASI çalıştırılıyor ki migration'lar şemaya işlenmiş olsun.
        #
        # Amaç (AC-1.4): `packages/types/src/database.ts` her zaman DB şemasıyla birebir
        # aynı kalsın. Biri bir migration ekleyip `pnpm run db:types`'ı çalıştırıp
        # commit'lemeyi UNUTURSA burada KIRMIZI olmalı — sessiz kırılma yerine, ne
        # yapılması gerektiğini ve tam farkı açıkça log'a yazar.
        #
        # Windows/LF notu: `supabase gen types` LF üretir ve bu üretim `>` ile doğrudan
        # dosyaya yazılır (git'in checkout/commit smudge-clean filtreleri devreye
        # GİRMEZ) — yani `core.autocrlf`/`.gitattributes` (`* text=auto`) burada
        # devreye girmiyor, dosya zaten hem index'te hem çalışma kopyasında LF (ölçüldü:
        # `git ls-files --eol` → `i/lf w/lf`). Ayrıca bu job zaten `ubuntu-latest`
        # üzerinde koşuyor (autocrlf konusu Windows'a özgü, CI runner'ını etkilemiyor).
        # Dolayısıyla aşağıdaki `git diff`, satır-sonu farkından kaynaklı yanlış bir
        # alarm ÜRETEMEZ — yalnızca gerçek içerik driftini yakalar.
        run: |
          pnpm run db:types
          if ! git diff --exit-code -- packages/types/src/database.ts; then
            echo "::error::packages/types/src/database.ts, veritabanı şemasıyla senkron değil (drift tespit edildi)."
            echo "Bir migration eklendi/değiştirildi ama 'pnpm run db:types' çalıştırılıp çıktısı commit'lenmemiş görünüyor."
            echo "Düzeltmek için: yerel Supabase yığını ayaktayken 'pnpm run db:types' çalıştırın,"
            echo "ardından 'packages/types/src/database.ts' dosyasındaki değişikliği commit'leyin."
            echo "Yukarıdaki diff, tam olarak neyin değiştiği gösteriyor."
            exit 1
          fi
          echo "packages/types/src/database.ts güncel — drift yok."

      - name: Capture local Supabase connection info
        # Yerel anon key, Supabase CLI'nin tüm kurulumlarında sabit ve
        # herkese açık bilinen bir demo JWT'sidir (gizli bir sır değildir).
        # Yine de onu workflow'a gömmek yerine `supabase status -o env` ile
        # dinamik olarak okuyoruz; bu şekilde CLI/şablon ileride değişirse
        # workflow otomatik doğru değeri kullanmaya devam eder.
        # `supabase status -o env` çıktısı değerleri ÇİFT TIRNAK içinde
        # verir (ör. API_URL="http://127.0.0.1:54321"); bunları tırnaksız
        # KEY=VALUE satırlarına çevirmeden $GITHUB_ENV'e eklersek, tırnak
        # karakterleri değerin bir parçası olur ve URL/anon key bozulur.
        # Bu yüzden sed ile çevreleyen tırnakları temizliyoruz.
        run: |
          supabase status -o env | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        # B-055: run 32218286151'de bu adımdan hemen SONRAKİ apt indirmesi ağ aynası
        # takılınca job'un 20 dk bütçesini komple yedi (bkz. yukarıdaki `timeout-minutes`
        # notu). Anahtar `apps/web/package.json`daki `^1.49.1` ARALIĞINDAN değil,
        # `pnpm-lock.yaml` hash'inden türetiliyor: caret aralığı zaman içinde farklı
        # patch/minor sürümlere çözülebilir ama lockfile HER ZAMAN o an gerçekten kurulan
        # TAM sürümü sabitler — tarayıcı ikili revizyonu Playwright'ın tam sürümüne sıkı
        # bağlı olduğundan, yanlış sürüme ait bir önbelleği geri yüklemek testleri sessizce
        # kırar. `restore-keys` BİLEREK YOK: kısmi (OS-only) bir eşleşme yanlış tarayıcı
        # sürümü geri yükleyebilir; anahtar tutmazsa aşağıdaki adım zaten tam kuruluma düşer.
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        # Faz 4.5: `@playwright/test` artık `web` paketinin devDependency'si; kök
        # `node_modules/.bin` altında YOK. Çıplak `pnpm exec playwright` bu yüzden
        # "Command not found" ile düşer (ölçüldü) — çağrı pakete yönlendirilmeli.
        # Önbellek ISABET ETMEDİYSE (`--with-deps`): hem tarayıcı ikilisini indirir hem
        # apt sistem bağımlılıklarını kurar (`playwright install --help` çıktısı).
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies (önbellek isabeti)
        # Önbellek YALNIZCA indirilen tarayıcı ikililerini (~/.cache/ms-playwright) tutar;
        # apt paketleri runner'a özgüdür ve her koşumda taze VM'de yeniden kurulmak
        # ZORUNDADIR — bu yüzden isabet olsa da atlanamaz. `install-deps`, `install`'dan
        # AYRI bir alt komuttur ve YALNIZCA sistem bağımlılıklarını kurar, tarayıcı
        # indirmez (`playwright install-deps --help` ile doğrulandı) — böylece önbellek
        # isabetinde gereksiz tarayıcı indirmesi atlanmış olur.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          # A-12 (src/env.ts, superRefine): NODE_ENV === 'production' iken
          # AI_BACKEND_API_KEY zorunlu, aksi halde middleware (`src/proxy.ts`)
          # her `/api/*` isteğinde fail-fast eder. `pnpm run build` bunu
          # doğrudan tetiklemiyor (doğrulama build zamanında değil, istek
          # zamanında `proxy()` içinde çalışıyor — yerelde build tek başına
          # bu değişken olmadan da doğrulandı, geçti). Yine de bu adımın
          # ürettiği `.next` çıktısı aşağıdaki "Run E2E tests" adımında
          # `next start` ile servis edileceğinden, aynı prod-benzeri ortamı
          # bu adımdan itibaren tutarlı kurmak için burada da açıkça set
          # ediliyor (bkz. aşağıdaki not).
          AI_BACKEND_API_KEY: ci-e2e-placeholder-key
        run: pnpm run build

      - name: Run E2E tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          # B-042 / Faz 4.6: `supabase status -o env` bu anahtarı `SERVICE_ROLE_KEY`
          # adıyla veriyor (bkz. "Capture local Supabase connection info" adımı), uygulama
          # ise çalışma zamanında `SUPABASE_SERVICE_ROLE_KEY` okuyor; ad eşleşmezse sunucu
          # yapılandırılmamış sayılır, `account-deletion.spec.ts` gerekçeli şekilde skip
          # eder ve AC-4.6.2 CI'da hiç kanıtlanmamış olur. Bu step'in env'i `next start`
          # alt process'ine (`playwright.config.ts` webServer) `process.env` üzerinden zaten
          # akıyor (playwright webServer launch: `...process.env, ...webServer.env` — ölçüldü,
          # `playwright/lib/runner/index.js`), o yüzden webServer.env'de AYRICA tekrarlamaya
          # gerek yok.
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          # A-12 (src/env.ts): bu adım `playwright.config.ts`'in `webServer`
          # bloğu üzerinden `pnpm run start` (next start, NODE_ENV=production)
          # çalıştırır; middleware her `/api/*` isteğinde AI_BACKEND_API_KEY
          # arar. `playwright.config.ts` zaten kendi içinde bu değişken için
          # 'playwright-e2e-local-test-key' varsayılanını taşıdığından (o
          # dosya bu iş kapsamında değil, DOKUNULMADI) bu satır olmasa da
          # webServer alt process'i çökmez — ama CI'ın doğruluğunu başka bir
          # dosyadaki gizli bir varsayılana bağımlı bırakmamak için, tıpkı
          # yukarıdaki Supabase değişkenlerinde olduğu gibi burada da açıkça
          # geçiriyoruz (defense-in-depth). GERÇEK SIR DEĞİLDİR — ai_backend
          # servisi bu job'ta ayağa kalkmaz, zod doğrulamasını geçecek boş
          # olmayan bir CI-yerel test değeri yeterlidir.
          AI_BACKEND_API_KEY: ci-e2e-placeholder-key
        run: pnpm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          # Faz 4.5: playwright.config.ts `apps/web` altında; reporter çıktısını
          # kendi dizinine yazar.
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: apps/web/test-results/
          retention-days: 14

  docker:
    name: Docker build (no push)
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # v3 -> v4: Faz 4.5 c7a2'de diğer Actions hizalanırken bu unutulmuş; CI'da
      # "Node.js 20 is deprecated" uyarısı düştü (v3 hâlâ node20 hedefliyordu). v4 serisi
      # `using: node24` kullanıyor (ölçüm v4.2.0 üzerinde yapıldı) (B-055), diğer Actions
      # ile aynı hizaya geldi.
      - uses: docker/setup-buildx-action@v4

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}

      - name: Build ai-backend image
        uses: docker/build-push-action@v7
        with:
          context: ./ai_backend
          push: false

  security:
    name: Security scanning (semgrep / gitleaks / pnpm audit / pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      # gitleaks'in PR taraması (base..head) ve haftalık tam geçmiş taraması git log'una
      # ihtiyaç duyar; bu yüzden fetch-depth burada — SADECE bu job'un checkout adımında —
      # 0'a çekiliyor. Diğer job'lar (frontend/backend/e2e/docker) varsayılan sığ checkout'u
      # korur.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pnpm, setup-node'dan ÖNCE (bkz. `frontend` job'undaki aynı notu).
      - uses: pnpm/action-setup@v6

      # NOT: `cache: 'pnpm'` BİLEREK verilmiyor. Bu job hiçbir adımda `pnpm install`
      # koşmuyor (`pnpm audit --prod` yalnızca `pnpm-lock.yaml`'ı okur, kurulum yapmaz);
      # dolayısıyla pnpm store hiç oluşmuyor. `cache: 'pnpm'` verilince setup-node yine de
      # `Post Run` adımında store'u kaydetmeye çalışıp "Path Validation Error: Path(s)
      # specified in the action for caching do(es) not exist" ile job'u kırıyordu (ölçüldü).
      #
      # `package-manager-cache: false`: `setup-node` v5'ten itibaren, `cache:` input'u
      # verilmemişse `package.json`'daki `packageManager` alanına bakıp OTOMATİK önbellekleme
      # açıyor (bkz. actions/setup-node PR #1348) — bu repoda `packageManager: "pnpm@10.34.5"`
      # var, yani otomatik davranış yukarıdaki tam senaryoyu (pnpm store hiç oluşmadan cache
      # denemesi → Path Validation Error) sessizce yeniden tetikleyebilirdi. Faz 4.5 commit
      # 7a2 notu: v6.0.0 ("Limit automatic caching to npm") bu otomatik davranışı npm'e
      # daralttı, pnpm/yarn için varsayılan artık kapalı — yani v7'de bu satır olmasa bile
      # aynı kırılma tekrar OLUŞMAZ (ölçüldü: değişiklik geçmişinden doğrulandı). Yine de
      # açıkça `false` bırakıyoruz: hem niyeti belgeler hem de action'ın gelecekte pnpm için
      # otomatik önbelleklemeyi tekrar açması ihtimaline karşı savunma sağlar.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install uv
        # v5 → v7 bumpının ölçümü ve v8+'ın neden ALINMADIĞI için bkz. `backend` job'undaki
        # aynı adımın uzun notu. Bu job setup-uv'den sonra yalnızca `uvx` çağırıyor
        # (semgrep, pip-audit) — v6'nın kaldırdığı otomatik venv aktivasyonuna bağımlı değil.
        uses: astral-sh/setup-uv@v7
        with:
          # `backend` job'undaki pin 3.14'e çekildi (B-055) ama BU pin bilerek 3.12'de
          # kalıyor: bu job `ai_backend`'in kendi ortamını hiç kurmuyor, setup-uv'den sonra
          # yalnızca `uvx` ile bağımsız araçlar (semgrep, pip-audit) çağırıyor — `ai_backend`
          # kaynağının hangi Python'da çalıştığıyla İLİŞKİSİZ, o yüzden sürüklenme riski yok.
          python-version: '3.12'

      # --- semgrep (SAST) ---
      # `semgrep/semgrep` resmi action'ı yerine `uvx semgrep` tercih edildi: (1) `ai_backend`
      # job'u zaten `uv`/`uvx`'i kurulu bir araç olarak kullanıyor, aynı deseni tekrarlamak
      # ek bir Docker imajı çekmekten (resmi action'ın temeli) daha hafif ve hızlı; (2) bu,
      # `docs/security/tooling-baseline.md` §4'te YEREL olarak doğrulanmış komutun BİREBİR
      # aynısı — CI'daki davranış denetimde ölçülenle tutarlı kalır. `--metrics=off` semgrep'in
      # anonim kullanım telemetrisini kapatır. `--severity=ERROR` + `--error`: semgrep'in
      # `--error` bayrağı TEK BAŞINA "herhangi bir bulguda" exit 1 verir (severity'den bağımsız);
      # bu proje üzerinde yerel doğrulamada bu tek başına yanlış bir kırmızıya yol açtığı
      # görüldü (`pyproject.toml` için MEDIUM önem dereceli, gerçek bir güvenlik açığı OLMAYAN
      # bir "dependency cooldown" öneri kuralı). `--severity=ERROR` yalnızca ERROR (yüksek
      # önem/güven) kuralları rapora dahil eder — kabul kriterindeki "high+ bulguda kırılsın"
      # şartı budur; MEDIUM/WARNING/INFO seviyesindeki öneriler job'u kırmıyor.
      - name: semgrep — frontend (TypeScript / React)
        run: >-
          uvx semgrep --config p/owasp-top-ten --config p/typescript --config p/react
          --error --severity=ERROR --metrics=off apps/web/src/

      - name: semgrep — backend (Python)
        run: >-
          uvx semgrep --config p/owasp-top-ten --config p/python
          --error --severity=ERROR --metrics=off ai_backend/

      # --- gitleaks (secret taraması) ---
      # Resmi `gitleaks/gitleaks-action` yerine doğrudan release binary'si indiriliyor:
      # o action private repo'larda lisans anahtarı istiyor ve ek bir üçüncü parti Docker
      # imajı gerektiriyor. Sürüm, yerel denetimde kullanılan ve doğrulanmış olan 8.30.1'e
      # sabitlendi (bkz. tooling-baseline.md §1) — tekrarlanabilirlik için.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          chmod +x "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version

      # PR'da yalnızca BU PR'ın getirdiği yeni commit'ler taranır — tüm geçmişi her PR'da
      # taramak gereksiz yavaşlık yaratır (bkz. tooling-baseline.md §9 CI önerisi).
      - name: gitleaks — yeni commit'ler (PR)
        if: github.event_name == 'pull_request'
        run: |
          gitleaks detect --source . --redact \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      # main'e push'ta da aynı mantıkla yalnızca yeni gelen commit'ler taranır. `before` tüm
      # sıfırlardan oluşuyorsa (branch'in ilk push'u / olağandışı bir olay) `git log` geçersiz
      # bir aralıkla patlar; bu durumda güvenli bir tabana düşülüp yalnızca son commit taranır.
      - name: gitleaks — yeni commit'ler (push)
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            gitleaks detect --source . --redact --log-opts="-1"
          else
            gitleaks detect --source . --redact --log-opts="${BEFORE}..${{ github.event.after }}"
          fi

      # Haftalık zamanlanmış tarama: PR/push adımlarının taramadığı her şeyi (ör. geçmişte
      # `--no-verify` ile main'e girmiş bir commit) yakalamak için TAM git geçmişi (bkz. yukarı,
      # `on.schedule`). `--log-opts` verilmez — gitleaks bunu varsayılan olarak tüm `git log`
      # geçmişini tarama anlamına getirir.
      - name: gitleaks — tam geçmiş (haftalık schedule)
        if: github.event_name == 'schedule'
        run: gitleaks detect --source . --redact -v

      # --- pnpm audit (bağımlılık zafiyetleri, yalnızca prod bağımlılıkları) ---
      # `npm audit --audit-level=high --omit=dev` idi; `package-lock.json` silindiği için
      # npm'in denetimi artık çalışamaz. pnpm karşılığı `--prod` (= `--omit=dev`) +
      # `--audit-level=high`. Niyet AYNEN korunuyor: high ve üstü bir bulguda job kırılır.
      # Ölçüldü (pnpm 10.34.5, bu ağaç): `--prod` ile "No known vulnerabilities found",
      # exit 0; `--prod`suz aynı komut 8 high + 1 critical bulup exit 1 veriyor — yani
      # hem prod/dev ayrımı hem de kırılma davranışı beklendiği gibi çalışıyor.
      # Çıktı biçimi npm'inkinden farklı (tablo, JSON değil) ama bu adım çıktıyı
      # ayrıştırmıyor, yalnızca exit kodunu kullanıyor.
      # T-04 (tooling-baseline.md §2) ÇÖZÜLDÜ: `next-pwa@5.6.0` build-time zafiyetler taşıyan
      # terk edilmiş ağacıyla birlikte `package.json`'da artık `devDependencies` altında
      # (production ağacının dışında), bu yüzden `--prod` taraması onu kapsamıyor.
      - name: pnpm audit (production bağımlılıkları)
        run: pnpm audit --prod --audit-level=high

      # --- pip-audit (ai_backend Python bağımlılıkları) ---
      # `uvx pip-audit` ÇIPLAK ÇALIŞTIRILMAZ — pip-audit'in KENDİ izole ortamını tarayıp
      # (fastapi/starlette/uvicorn hiç görünmeden) projeyi hiç kapsamadığı yerel denetimde
      # doğrulandı (tooling-baseline.md §3). Doğru yöntem: `uv export` ile projenin gerçek
      # çözümlenmiş bağımlılık grafiğini bir requirements dosyasına yazıp `-r` ile onu taramak.
      # `--no-emit-project` projenin kendi editable self-reference satırını (`-e .` / `.`)
      # dışlar — bu satır pip-audit'e bir gereksinim olarak anlamlı gelmez.
      - name: Export ai_backend bağımlılıkları
        working-directory: ai_backend
        run: uv export --format requirements-txt --no-hashes --no-emit-project -o requirements-ci.txt

      - name: pip-audit
        working-directory: ai_backend
        run: uvx pip-audit -r requirements-ci.txt --progress-spinner off

  required-checks:
    name: Required checks
    if: always()
    # `mobile` Faz 4.5 commit 7b'de eklendi — zorunlu kapı listesine de girmek ZORUNDA:
    # aksi hâlde job kırmızı olur ama `required-checks` yeşil kalır ve kapı sessizce delinir.
    needs: [frontend, mobile, backend, e2e, docker, security]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        run: |
          echo "frontend: ${{ needs.frontend.result }}"
          echo "mobile: ${{ needs.mobile.result }}"
          echo "backend: ${{ needs.backend.result }}"
          echo "e2e: ${{ needs.e2e.result }}"
          echo "docker: ${{ needs.docker.result }}"
          echo "security: ${{ needs.security.result }}"
          if [[ "${{ needs.frontend.result }}" != "success" ]] || \
             [[ "${{ needs.mobile.result }}" != "success" ]] || \
             [[ "${{ needs.backend.result }}" != "success" ]] || \
             [[ "${{ needs.docker.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]] || \
             { [[ "${{ needs.e2e.result }}" != "success" ]] && [[ "${{ needs.e2e.result }}" != "skipped" ]]; }; then
            echo "One or more required jobs failed."
            exit 1
          fi
