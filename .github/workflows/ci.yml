name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Build-time için sahte NEXT_PUBLIC_* değerleri (gerçek sır değil).
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  frontend:
    name: Frontend (lint / type-check / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests (coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build
        run: npm run build

  backend:
    name: Backend (ruff / mypy / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app

      - name: pytest
        run: uv run pytest

  e2e:
    name: E2E (Playwright)
    needs: [frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    # NOT: playwright.config.ts'deki webServer bloğu `npm run build && npm run
    # start` çalıştırıyor ve CI'da (process.env.CI true olduğu için)
    # reuseExistingServer: false oluyor — yani `npm run test:e2e` adımı
    # webServer'ı kendi alt process'i olarak başlatıp gizlice TEKRAR build
    # alıyor. Bu ikinci (örtük) build de gerçek Supabase URL/anon key'e
    # ihtiyaç duyar, yoksa testler hiçbir yere bağlanamaz.
    # İdeal olan bu değerleri statik bir job-level `env:` ile tüm step'lere
    # sızdırmaktı ("en temizi") — ama biz anon key'i sabit gömmek yerine
    # `supabase status` ile ÇALIŞMA ZAMANINDA (runtime) okumayı tercih
    # ettiğimiz için (bkz. "Capture local Supabase connection info" adımı),
    # değer job başlamadan (statik YAML ayrıştırma anında) bilinemiyor —
    # job-level `env:` bu yüzden burada kullanılamıyor. Bunun yerine aynı
    # "tüm ilgili step'lere sızma" etkisini elde etmek için: (1) değerleri
    # `$GITHUB_ENV`'e yazıyoruz, (2) hem "Build" adımına hem de webServer'ı
    # tetikleyen "Run E2E tests" adımına AÇIKÇA step-level `env:` ile
    # geçiriyoruz — böylece webServer'ın alt process'i de dahil olmak üzere
    # üstteki placeholder workflow-env'i güvenilir şekilde override ediyoruz
    # (step-level env, job/workflow-level env'e karşı her zaman kazanır).
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Reset database (run migrations + seed)
        # NOT: `--no-seed` KULLANMIYORUZ — E2E testleri coach@example.com /
        # client1@example.com gibi seed kullanıcılarıyla giriş yapıyor.
        # `supabase db reset` burada YIKICI DEĞİL: bu adımdan hemen önce
        # `supabase start` ile CI runner'ında SIFIRDAN, boş ve geçici bir
        # yığın ayağa kaldırıldı; reset edilecek gerçek/kalıcı bir veri yok.
        run: supabase db reset

      - name: Capture local Supabase connection info
        # Yerel anon key, Supabase CLI'nin tüm kurulumlarında sabit ve
        # herkese açık bilinen bir demo JWT'sidir (gizli bir sır değildir).
        # Yine de onu workflow'a gömmek yerine `supabase status -o env` ile
        # dinamik olarak okuyoruz; bu şekilde CLI/şablon ileride değişirse
        # workflow otomatik doğru değeri kullanmaya devam eder.
        # `supabase status -o env` çıktısı değerleri ÇİFT TIRNAK içinde
        # verir (ör. API_URL="http://127.0.0.1:54321"); bunları tırnaksız
        # KEY=VALUE satırlarına çevirmeden $GITHUB_ENV'e eklersek, tırnak
        # karakterleri değerin bir parçası olur ve URL/anon key bozulur.
        # Bu yüzden sed ile çevreleyen tırnakları temizliyoruz.
        run: |
          supabase status -o env | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
        run: npm run build

      - name: Run E2E tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  docker:
    name: Docker build (no push)
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}

      - name: Build ai-backend image
        uses: docker/build-push-action@v6
        with:
          context: ./ai_backend
          push: false

  required-checks:
    name: Required checks
    if: always()
    needs: [frontend, backend, e2e, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        run: |
          echo "frontend: ${{ needs.frontend.result }}"
          echo "backend: ${{ needs.backend.result }}"
          echo "e2e: ${{ needs.e2e.result }}"
          echo "docker: ${{ needs.docker.result }}"
          if [[ "${{ needs.frontend.result }}" != "success" ]] || \
             [[ "${{ needs.backend.result }}" != "success" ]] || \
             [[ "${{ needs.docker.result }}" != "success" ]] || \
             { [[ "${{ needs.e2e.result }}" != "success" ]] && [[ "${{ needs.e2e.result }}" != "skipped" ]]; }; then
            echo "One or more required jobs failed."
            exit 1
          fi
